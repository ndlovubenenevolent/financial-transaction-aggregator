server:
  port: 8081

spring:
  application:
    name: bank-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

bank:
  simulator:
    interval-ms: ${BANK_SIMULATOR_INTERVAL_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fintech.aggregator: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - customerId=%X{customerId} eventId=%X{eventId} - %msg%n"
