server:
  port: 8083

spring:
  application:
    name: investment-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

investment:
  simulator:
    interval-ms: ${INVESTMENT_SIMULATOR_INTERVAL_MS:10000}
    customer-pool-size: ${INVESTMENT_SIMULATOR_CUSTOMER_POOL_SIZE:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fintech.aggregator: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - customerId=%X{customerId} eventId=%X{eventId} - %msg%n"
